<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Water Rafting | Contact Us</title>
    <meta name="description"
      content="Contact page for White Water Rafting. Get in touch with our team for inquiries, bookings, address details, and location maps.">
    <meta name="author" content="Gabriel Awushie-Tetteh">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <!-- Header -->
    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo" class="logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html" class="active">Contact Us</a>
        </nav>
    </header>

    <main>
        <!-- Company Information -->
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <address>
                <p>14 Riverway Street, East Legon</p>
                <p>Accra, Ghana</p>
                <p>Digital Address: GA-183-9021</p>
                <p><a href="tel:+233240000000">+233 24 000 0000</a></p>
                <p><a href="mailto:info@whitewater.com.gh">info@whitewater.com.gh</a></p>
            </address>
        </section>

        <!-- Map & Form Container -->
        <div class="map-form-container">
            <div class="map-section">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d127059.20038891157!2d-0.20815132646484373!3d5.603716800000001!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xfdf9084b2b7a773%3A0x2b489ed11b2b8e8!2sAccra%2C%20Ghana!5e0!3m2!1sen!2sgh!4f13.1"
                  width="600" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <div class="form-section">
                <form class="contact-form">
                    <div class="form-group">
                        <label for="username">Name</label>
                        <input type="text" id="username" name="username" placeholder="Your Name"
                          required>
                    </div>

                    <div class="form-group">
                        <label for="useremail">Email</label>
                        <input type="email" id="useremail" name="useremail" placeholder="Your Email"
                          required>
                    </div>

                    <fieldset class="purpose-fieldset">
                        <legend>Message Purpose</legend>
                        <label for="purpose-general" class="radio-label">
                            <input type="radio" id="purpose-general" name="purpose" value="general"
                              checked> General Inquiry
                        </label>
                        <label for="purpose-reservation" class="radio-label">
                            <input type="radio" id="purpose-reservation" name="purpose"
                              value="reservation"> Reservation Question
                        </label>
                        <label for="purpose-suggestion" class="radio-label">
                            <input type="radio" id="purpose-suggestion" name="purpose"
                              value="suggestion"> Website Suggestion
                        </label>
                    </fieldset>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4"
                          placeholder="Type here..."></textarea>
                    </div>

                    <div class="form-group checkbox-group">
                        <label for="newsletter">
                            <input type="checkbox" id="newsletter" name="newsletter"> Please
                            Subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit" class="submit-btn">Get in Touch!</button>
                </form>
            </div>
        </div>

        <!-- Employees Section -->
        <section class="employees-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="White Water Rafting Instructor">
                    <figcaption>White Water Rafting Instructor</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Adventure Tour Coordinator">
                    <figcaption>Adventure Tour Coordinator</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Rafting Guide">
                    <figcaption>Rafting Guide</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <!-- Footer using your actual SVG images -->
    <footer>
        <p>&copy; 2026 | White Water Rafting | Gabriel Awushie-Tetteh</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank" aria-label="Facebook">
                <img src="images/facebook.svg" alt="Facebook logo">
            </a>
            <a href="https://linkedin.com" target="_blank" aria-label="LinkedIn">
                <img src="images/linkedin.svg" alt="LinkedIn logo">
            </a>
            <a href="https://whatsapp.com" target="_blank" aria-label="WhatsApp">
                <img src="images/whatsapp.svg" alt="WhatsApp logo">
            </a>
        </nav>
    </footer>
</body>

</html>
