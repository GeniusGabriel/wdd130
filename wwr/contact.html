<!DOCTY PE html>
    <html lang="en-US">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>White Water Rafting | Contact Us</title>
        <meta name="description"
          content="Contact page for White Water Rafting. Get in touch with our team for inquiries, bookings, address details, and location maps.">
        <meta name="author" content="Gabriel Awushie-Tetteh">
        <link rel="stylesheet" href="styles/rafting.css">
    </head>

    <body>
        <!-- Standard Site Header -->
        <header>
            <img src="images/logo.png" alt="White Water Rafting Logo" class="logo">
            <nav>
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="trips.html">Trips</a>
                <a href="contact.html" class="active">Contact Us</a>
            </nav>
        </header>

        <main>

            <!-- Company Information -->
            <section class="company-info">
                <h1>White Water Rafting Company</h1>
                <address>
                    <p>14 Riverway Street, East Legon</p>
                    <p>Accra, Ghana</p>
                    <p>Digital Address: GA-183-9021</p>
                    <p><a href="tel:+233240000000">+233 24 000 0000</a></p>
                    <p><a href="mailto:info@whitewater.com.gh">info@whitewater.com.gh</a></p>
                </address>
            </section>

            <!-- Side-by-Side Map and Form Layout -->
            <div class="map-form-container">
                <!-- Embedded Google Map -->
                <section class="map-section">
                    <iframe
                      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.83543450937!2d-122.4194155!3d37.7749295!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085808580858085%3A0x0!2zMzfCsDQ2Jz2OSyAxMjLCsDI1JzA5LjkiVw!5e0!3m2!1sen!2sus!4f13.1"
                      width="100%" height="100%" allowfullscreen="" loading="lazy"
                      referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </section>

                <!-- Contact Form -->
                <section class="form-section">
                    <form class="contact-form">
                        <div class="form-group">
                            <label for="username">Name</label>
                            <input type="text" id="username" name="username" placeholder="Your Name"
                              required>
                        </div>

                        <div class="form-group">
                            <label for="useremail">Email</label>
                            <input type="email" id="useremail" name="useremail"
                              placeholder="Your Email" required>
                        </div>

                        <fieldset class="purpose-fieldset">
                            <legend>Message Purpose</legend>
                            <label class="radio-label">
                                <input type="radio" name="purpose" value="general" checked> General
                                Inquiry
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="purpose" value="reservation"> Reservation
                                Question
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="purpose" value="suggestion"> Website
                                Suggestion
                            </label>
                        </fieldset>

                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="4"
                              placeholder="Type here..."></textarea>
                        </div>

                        <div class="form-group checkbox-group">
                            <label for="newsletter">
                                <input type="checkbox" id="newsletter" name="newsletter"> Please
                                Subscribe me to the monthly newsletter
                            </label>
                        </div>

                        <button type="submit" class="submit-btn">Get in Touch!</button>
                    </form>
                </section>
            </div>

            <!-- Employee Profiles Section -->
            <section class="employees-section">
                <h2>We Are Here to Serve You</h2>
                <div class="employee-grid">
                    <figure>
                        <img src="images/employee1.jpg" alt="Employee Profile 1">
                        <figcaption>white water rafting instructor</figcaption>
                    </figure>
                    <figure>
                        <img src="images/employee2.jpg" alt="Employee Profile 2">
                        <figcaption>Adventure Tour Cordinator</figcaption>
                    </figure>
                    <figure>
                        <img src="images/employee3.jpg" alt="Employee Profile 3">
                        <figcaption>Rafting Guide</figcaption>
                    </figure>
                </div>
            </section>
        </main>

        <!-- Standard Site Footer -->
        <footer>
            <p>&copy; 2026 | White Water Rafting | Gabriel Awushie-Tetteh</p>
            <div class="social-links">
                <a href="https://facebook.com" target="_blank"><img src="images/facebook.svg"
                      alt="Facebook Icon"></a>
                <a href="https://whatsapp.com" target="_blank"><img src="images/whatsapp.svg"
                      alt="Whatsapp Icon"></a>
                <a href="https://linkedin.com" target="_blank"><img src="images/linkedin.svg"
                      alt="Linkedin Icon"></a>
            </div>
        </footer>
    </body>

    </html>
